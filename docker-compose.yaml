services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel_invpaz
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - app_network

  python_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: python_backend_invpaz
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge